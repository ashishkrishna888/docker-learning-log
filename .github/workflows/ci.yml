name: Java CI Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Day011/docker-maven-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # DEBUG STEP (IMPORTANT)
      - name: Check Java version
        run: java -version

      # Build
      - name: Build project
        run: mvn clean install

      # Test
      - name: Run tests
        run: mvn test

      # Upload artifact
      - name: Upload JAR file
        uses: actions/upload-artifact@v4
        with:
          name: java-artifact
          path: Day011/docker-maven-demo/target/*.jar